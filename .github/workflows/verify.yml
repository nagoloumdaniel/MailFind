name: verify

# La meme barriere que le hook de pre-commit, mais sur l'ensemble du depot et
# sur une machine propre. Le hook ne voit que les fichiers indexes : il laisse
# passer une rupture provoquee par un fichier non touche par le commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `npm ci` et non `npm install` : la construction doit echouer si le
      # fichier de verrouillage ne correspond plus aux manifestes.
      - run: npm ci

      - run: npm run verify

  # Ce que les tests unitaires ne voient pas : les index d'unicite, les
  # transactions, la reprise d'un import interrompu. Sur un PostgreSQL de la
  # meme version majeure que Neon, jetable, sans TLS puisqu'il ne quitte pas la
  # machine.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mailfind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d mailfind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/mailfind_test?sslmode=disable

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run test:integration
