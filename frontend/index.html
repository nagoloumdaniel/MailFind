<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Bricolage Grotesque pour les titres et la marque, Instrument Sans pour
      l'interface et les donnees. Deux fontes franchement differentes, plutot
      que deux graisses d'une meme neutralite.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>MailFind : adresses professionnelles d'entreprises, avec leur source</title>
    <meta
      name="description"
      content="Importez une liste d'entreprises, MailFind retrouve leurs adresses e-mail professionnelles et garde, pour chacune, sa source et son statut de vérification. Bêta fermée."
    />
    <meta name="theme-color" content="#111C30" />

    <!-- Aperçu lors d'un partage de lien. Bêta fermée : rien de plus que l'essentiel. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MailFind" />
    <meta property="og:locale" content="fr_FR" />
    <meta
      property="og:title"
      content="MailFind : des adresses professionnelles, avec leur source"
    />
    <meta
      property="og:description"
      content="Une liste d'entreprises en entrée, des adresses e-mail professionnelles en sortie, chacune avec sa source, son statut de vérification et son score. Bêta fermée."
    />
    <meta property="og:url" content="https://mailfind.vercel.app/" />
    <meta property="og:image" content="https://mailfind.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Page d'accueil de MailFind : deux exemples d'adresses fictives avec leur source, leur méthode et leur statut"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="MailFind : des adresses professionnelles, avec leur source"
    />
    <meta
      name="twitter:description"
      content="Une liste d'entreprises en entrée, des adresses e-mail professionnelles en sortie, chacune avec sa source et son statut. Bêta fermée."
    />
    <meta name="twitter:image" content="https://mailfind.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
